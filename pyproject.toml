[project]
name = "ingestion-pipeline"
version = "0.1.0"
description = "Single-source (S3 upload) ingestion pipeline: fetch, dedup, convert, chunk, embed, persist, publish."
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "openpyxl>=3.1",
    "openai>=1.30",
    "neo4j>=5.28,<6",  # cognee[neo4j] requires neo4j<6
    "cognee[neo4j]>=1.6.10,<2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "s3fs>=2024.1",  # cognee imports it while storing documents, even for local files
    "fastapi[standard]>=0.141.1",
    "watchdog>=6.0.0",
    "docling>=2.0",
    "ftfy>=6.2",
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pgserver>=0.1.4"]
spike = ["pymupdf4llm>=0.0.10", "pypdf>=4.2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "watchdog>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_pipeline"]
