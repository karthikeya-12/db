[project]
name = "ingestion-pipeline"
version = "0.1.0"
description = "Single-source (S3 upload) ingestion pipeline: fetch, dedup, convert, chunk, embed, persist, publish."
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "openpyxl>=3.1",
    "openai>=1.30",
    "neo4j>=6.2.0",
    "fastapi[standard]>=0.141.1",
    "watchdog>=6.0.0",
    "torch>=2.13.0",
    "pandas>=3.0.5",
    "langchain-openai>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
spike = ["pymupdf4llm>=0.0.10", "pypdf>=4.2"]
docling = ["docling>=2.0", "ftfy>=6.2"]
graph = ["neo4j>=5.20"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "watchdog>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_pipeline"]
